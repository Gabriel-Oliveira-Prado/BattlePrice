<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattlePrice - Jogo</title>

    <link rel="shortcut icon" href="/Iconecarrinho.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body class="m-0 p-0">
    <header class="main-header d-flex flex-wrap justify-content-between py-3 px-4 text-white align-items-center w-100">
        <h1 class="m-0 d-flex align-items-center gap-2 fs-4">
            <a href="/" class="text-white text-decoration-none d-flex align-items-center gap-2">
                <img src="/iconecarrinho.png" alt="Logo do BattlePrice" class="rounded-circle logo-bg" width="40"
                    height="40">
                BattlePrice
            </a>
        </h1>

        <nav class="nav d-flex align-items-center gap-3">
            <a class="text-white text-decoration-none fw-bold d-flex align-items-center gap-1" href="#" id="placar-btn"><i
                    class="bi bi-trophy-fill text-warning"></i> Placar</a>
            <a class="nav-link text-white btn-action" href="login.html">Entrar</a>
        </nav>
    </header>

    <main class="container-fluid min-vh-100 d-flex flex-column align-items-center justify-content-center p-0 m-0 w-100">

        <div id="tela-jogo" class="animate-slide-up">

            <div class="caixa-contador">
                <p id="contador-chances"></p>
            </div>

            <div class="conteudo-jogo">
                <div class="caixa-imagem-api position-relative">
                    <div id="loading-spinner" class="spinner-border text-success position-absolute" role="status"
                        style="display: none;">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <img src=" " alt="Item do Jogo" id="imagem-produto">
                </div>

                <div class="caixa-palpite">
                    <div class="d-flex justify-content-center align-items-center gap-2 mb-1">
                        <h3 class="m-0">Qual é o preço deste item?</h3>
                        <span id="dica-seta" class="fs-4 fw-bold"></span>
                    </div>
                    <input type="number" id="palpite-usuario"
                        class="form-control bg-transparent text-white border-secondary"
                        placeholder="Digite o valor em R$" aria-label="Valor em reais do palpite">
                    <button id="btn-chutar">Chutar Preço</button>
                </div>
            </div>

        </div>

    </main>
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-4 px-4 w-100 text-white mt-auto">
        <div class="d-flex align-items-center gap-2 fs-5 fw-bold">
            <a href="/" class="text-white text-decoration-none d-flex align-items-center gap-2">
                <img src="/iconecarrinho.png" alt="Logo do BattlePrice" width="40" height="40"
                    class="rounded-circle logo-bg">
                <span>BattlePrice</span>
            </a>
        </div>

        <ul class="nav list-unstyled d-flex gap-3 align-items-center mb-0">
            <li><a class="text-white text-decoration-none d-flex align-items-center gap-1"
                    href="https://github.com/Gabriel-Oliveira-Prado/BattlePrice.git" target="_blank"><i
                        class="bi bi-github fs-4"></i> GitHub</a></li>
        </ul>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/authUI.js"></script>
</body>

</html>
