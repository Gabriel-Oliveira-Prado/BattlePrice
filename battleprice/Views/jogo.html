<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattlePrice - Jogo</title>
   
    <link rel="shortcut icon" href="/Iconecarrinho.png" type="image/x-icon"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="m-0 p-0">
<header class="d-flex flex-wrap justify-content-between py-3 px-4 text-white align-items-center w-100" style="background-color: #0E1326; z-index: 10;">
    <h1 class="m-0 d-flex align-items-center gap-2 fs-4">
        <img src="/iconecarrinho.png" alt="Logo do BattlePrice" class="rounded-circle" width="40" height="40" style="background-color: #f0f0f0; object-fit: cover;">
        BattlePrice 
    </h1>
    
    <nav class="nav">
        <a class="nav-link text-white btn btn-primary bg-opacity-25 border-0 rounded-pill px-3 py-1 me-2" href="login.html">Login</a>
        <a class="nav-link text-white btn btn-primary bg-opacity-25 border-0 rounded-pill px-3 py-1" href="cadastro.html">Entrar</a>
    </nav>
</header>

<main class="container-fluid min-vh-100 d-flex flex-column align-items-center justify-content-center p-0 m-0 w-100">

    <div id="tela-inicial">
        <h2 class="titulo-principal">
            <span class="metade-amarela">Battle</span><span class="metade-verde">Price</span>
        </h2>
        <p id="mensagem-inicial">clique em qualquer lugar para começar!</p>
    </div>
    
    <div id="tela-jogo" class="escondido">
    
    <div class="caixa-contador">
        <p id="contador-chances" style="padding: 0; margin-bottom: 10px;"></p>
    </div>

    <div class="conteudo-jogo">
        <div class="caixa-imagem-api">
            <img src=" " alt="Item do Jogo" id="imagem-produto">
        </div>

        <div class="caixa-palpite">
            <h3>Qual é o preço deste item?</h3>
            <input type="number" id="palpite-usuario" placeholder="Digite o valor em R$">
            <button id="btn-chutar">Chutar Preço</button>
        </div>
    </div>

</div>

</main>
<footer class="d-flex flex-wrap justify-content-between align-items-center py-4 px-4 w-100 text-white mt-auto" style="background-color: #0E1326;">
    <div class="d-flex align-items-center gap-2 fs-5 fw-bold">
        <img src="/iconecarrinho.png" alt="Logo do BattlePrice" width="40" height="40" class="rounded-circle" style="background-color: #f0f0f0; object-fit: cover;">
        <span>BattlePrice</span>
    </div>

    <ul class="nav list-unstyled d-flex gap-3 align-items-center mb-0">
        <li><a class="text-white text-decoration-none d-flex align-items-center gap-1" href="https://github.com/Gabriel-Oliveira-Prado/BattlePrice.git" target="_blank"><i class="bi bi-github fs-4"></i> GitHub</a></li>
    </ul>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <script type="module" src="/src/js/main.js"></script>  
</body>
</html>
