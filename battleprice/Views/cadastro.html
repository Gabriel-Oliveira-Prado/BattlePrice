<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattlePrice - Cadastro</title>
    <link rel="shortcut icon" href="/Iconecarrinho.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="m-0 p-0">
<header class="d-flex flex-wrap justify-content-between py-3 px-4 text-white align-items-center w-100" style="background-color: #0E1326; z-index: 10;">
    <h1 class="m-0 d-flex align-items-center gap-2 fs-4">
        <img src="/iconecarrinho.png" alt="Logo do BattlePrice" class="rounded-circle" width="40" height="40" style="background-color: #f0f0f0; object-fit: cover;">
        BattlePrice 
    </h1>
    
    <nav class="nav">
        <a class="nav-link text-white btn btn-primary bg-opacity-25 border-0 rounded-pill px-3 py-1 me-2" href="#">Contato</a>
        <a class="nav-link text-white btn btn-primary bg-opacity-25 border-0 rounded-pill px-3 py-1" href="#">Apoie</a>
    </nav>
</header>

<main class="container-fluid min-vh-100 d-flex flex-column align-items-center justify-content-center p-0 m-0 w-100" id=""> 
        <div class="container-central-login">
            <h2>Cadastro</h2>   
                <input type="text" placeholder="Nome">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Senha">
                <button type="submit"  >Cadastrar</button>
        </div>
    </main>
<footer class="d-flex flex-wrap justify-content-between align-items-center py-4 px-4 w-100 text-white mt-auto" style="background-color: #0E1326;">
    <div class="d-flex align-items-center gap-2 fs-5 fw-bold">
        <img src="/iconecarrinho.png" alt="Logo do BattlePrice" width="40" height="40" class="rounded-circle" style="background-color: #f0f0f0; object-fit: cover;">
        <span>BattlePrice</span>
    </div>

    <ul class="nav list-unstyled d-flex gap-3 align-items-center mb-0">
        <li><a class="text-white text-decoration-none d-flex align-items-center gap-1" href="https://github.com/Gabriel-Oliveira-Prado/BattlePrice.git" target="_blank"><i class="bi bi-github fs-4"></i> GitHub</a></li>
    </ul>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
