<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BattlePrice - login</title>
  <link rel="shortcut icon" href="/assets/favicon-32x32.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body class="m-0 p-0">
  <header class="main-header d-flex flex-wrap justify-content-between py-3 px-4 text-white align-items-center w-100">
    <h1 class="m-0 d-flex align-items-center gap-2 fs-4">
      <a href="/" class="text-white text-decoration-none d-flex align-items-center gap-2">
        <img src="/iconecarrinho.png" alt="Logo do BattlePrice" class="rounded-circle logo-bg" width="40"
          height="40">BattlePrice
      </a>
    </h1>

    <nav class="nav d-flex align-items-center gap-3">
      <a class="text-white text-decoration-none fw-bold d-flex align-items-center gap-1" href="#" id="placar-btn"><i
          class="bi bi-trophy-fill text-warning"></i> Placar</a>
      <a class="nav-link text-white btn-action" href="login.html">Entrar</a>
    </nav>
  </header>
  <main class="container-fluid min-vh-100 d-flex flex-column align-items-center justify-content-center p-0 m-0 w-100">
    <div class="container-central-login position-relative animate-slide-up">
      <a href="/" class="btn-voltar position-absolute text-white fs-4"><i class="bi bi-arrow-left"></i></a>
      <h2><i class="bi bi-person-fill me-2"></i>Faça seu login</h2>
      <form action="jogo.html" class="w-100 d-flex flex-column gap-3">
        <input type="email" name="email" class="form-control bg-transparent text-white border-secondary" placeholder="Email:"
          aria-label="E-mail" required>
        <div class="position-relative w-100">
          <input type="password" name="senha" id="senhaInput" class="form-control bg-transparent text-white border-secondary"
            placeholder="Senha:" aria-label="Senha" style="padding-right: 45px;" required>
          <i class="bi bi-eye position-absolute text-white" id="togglePassword"
            style="right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.7; font-size: 1.2rem;"></i>
        </div>
        <button type="submit" class="botao-login w-100 mt-2">Entrar</button>
      </form>
      <p class="mt-3 mb-0 text-white w-100">Ainda não tem conta? <a href="cadastro.html"
          class="link-destaque text-decoration-none fw-bold">Cadastre-se</a></p>
    </div>
  </main>
  <footer class="d-flex flex-wrap justify-content-between align-items-center py-4 px-4 w-100 text-white mt-auto">
    <div class="d-flex align-items-center gap-2 fs-5 fw-bold">
      <a href="/" class="text-white text-decoration-none d-flex align-items-center gap-2">
        <img src="/iconecarrinho.png" alt="Logo do BattlePrice" width="40" height="40" class="rounded-circle logo-bg">
        <span>BattlePrice</span>
      </a>
    </div>

    <ul class="nav list-unstyled d-flex gap-3 align-items-center mb-0">
      <li><a class="text-white text-decoration-none d-flex align-items-center gap-1"
          href="https://github.com/Gabriel-Oliveira-Prado/BattlePrice.git" target="_blank"><i
            class="bi bi-github fs-4"></i> GitHub</a></li>
    </ul>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document
      .getElementById("togglePassword")
      .addEventListener("click", function () {
        const input = document.getElementById("senhaInput");
        const icon = this;
        if (input.type === "password") {
          input.type = "text";
          icon.classList.replace("bi-eye", "bi-eye-slash");
        } else {
          input.type = "password";
          icon.classList.replace("bi-eye-slash", "bi-eye");
        }
      });
  </script>
  <script src="/src/js/login.js"></script>
  <script type="module" src="/src/js/authUI.js"></script>
</body>

</html>
